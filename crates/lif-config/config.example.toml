# lif configuration file
#
# lif reads this file once, when the server starts, from the first of:
#   $LIF_CONFIG
#   $XDG_CONFIG_HOME/lif/config.toml
#   ~/.config/lif/config.toml
# A missing file is fine. Mistakes are reported when the server starts
# (file:line:column and what was expected) and never stop lif from starting;
# everything else in the file still applies.
#
# Every value below is lif's default, so this file changes nothing until you
# edit it: keep what you change, delete the rest. Each setting is the same as
# running a tmux command at startup; the command is shown after "=>".
# Key bindings use tmux key names and tmux command strings.

# ---------------------------------------------------------------- prefix ----

# The prefix key. Changing it is the whole job: the new key also sends
# itself to the pane when pressed twice, and C-b is freed.
#   prefix = "C-a"  =>  set -g prefix C-a; unbind C-b; bind C-a send-prefix
prefix = "C-b"

# A second prefix key, or false for none.  => set -g prefix2 None
prefix2 = false

# Milliseconds during which a repeatable binding (repeat = true below) can be
# pressed again without the prefix. 0 disables repeating.
repeat-time = 500

# --------------------------------------------------------- general ----------

# Mouse: click to select panes, drag borders, scroll.  => set -g mouse on
mouse = true

# What ending a mouse selection (a drag, a double or a triple click) does:
# "copy-pipe-and-cancel" copies and leaves copy mode (as tmux does),
# "copy-pipe-no-clear" copies and stays with the selection shown, "none"
# only selects. In tmux this is the MouseDragEnd1Pane binding.
mouse-drag-end = "copy-pipe-and-cancel"

# Copy mode keys: "emacs" or "vi" (the copy-mode or copy-mode-vi table).
# When this line is left out, vi if $VISUAL (or else $EDITOR) contains "vi"
# when the server starts, as in tmux.
mode-keys = "emacs"

# Characters that end a word in copy mode (besides spaces), and whether a
# search wraps around the top or bottom of the history.
word-separators = "!\"#$%&'()*+,-./:;<=>?@[\\]^`{|}~"
wrap-search = true

# The outer terminal's clipboard (OSC 52). Copies from copy mode always
# become a paste buffer; besides:
#   "on"        copies set the terminal's clipboard; OSC 52 from programs
#               in panes is forwarded to it and also kept as a paste buffer
#   "external"  copies set the terminal's clipboard; OSC 52 from programs
#               is forwarded to it but not kept as a buffer (tmux's
#               external ignores it entirely)
#   "off"       nothing reaches the terminal's clipboard, and OSC 52 from
#               programs is ignored
set-clipboard = "external"

# A command that copies are piped to (on its standard input, run with
# /bin/sh -c in the pane's directory): copy-pipe commands given without one
# of their own, which include the default copy keys (Enter in vi, M-w in
# emacs) and mouse copies. For example "pbcopy", "wl-copy" or
# "xclip -selection clipboard". Empty runs nothing.  => set -s copy-command ''
copy-command = ""

# Scrollback kept per pane: at most this many bytes and at most
# history-limit lines (below); both hold, and changing either also applies to
# existing panes. Accepts sizes: "512KB", "32MB", "1GB" (1 KB = 1024 bytes).
# A line of history costs about 1.7 KB at 200 columns (less in narrower
# panes) until the pane has been quiet for 2 s, when it is compressed.
# Memory is allocated in whole pages, so a small budget rounds up: 100KB
# shows as 819200 bytes in #{history_bytes} and list-panes.
#   => set -g scrollback-bytes 10485760
scrollback = "10MB"

# Scrollback limit in lines (tmux's history-limit), applied as well as the
# byte budget above. 0 keeps no scrollback.
history-limit = 4000

# The shell new panes run (an absolute path), and a command to run instead
# of a login shell. Both default to what the server starts with.
# default-shell = "/bin/zsh"
# default-command = ""

# Milliseconds messages stay on the status line.
display-time = 750

# Milliseconds pane numbers stay up (display-panes, prefix q).
display-panes-time = 1000

# Milliseconds a lone Escape waits for the rest of a key sequence (Alt+key,
# arrows) when the terminal speaks the legacy keyboard encoding. 0 never
# waits; an Alt+key split across reads then arrives as Escape and the key,
# as in tmux. Terminals with the kitty keyboard protocol (which lif enables
# when the terminal supports it) never wait.
escape-time = 5

# Stop the server when the last session closes.
exit-empty = true

# How many paste buffers to keep.
buffer-limit = 50

# What happens when a session's last window closes for attached clients:
# "off", "on" (detach), "no-detached", "previous" or "next" (switch session).
detach-on-destroy = "on"

# Destroy a session when nobody is attached to it any more: "off" or "on"
# ("keep-last" and "keep-group" are tmux's values for session groups and
# keep every session).
destroy-unattached = "off"

# Tell programs that ask for it when the terminal gains or loses focus.
focus-events = true

# ------------------------------------------------------ windows and panes ---

# Number of the first window and the first pane.
base-index = 0
pane-base-index = 0

# Renumber windows to close gaps when one closes.
renumber-windows = false

# Name windows after the program running in them, using this format.
automatic-rename = true
automatic-rename-format = "#{?pane_in_mode,[lif],#{pane_current_command}}#{?pane_dead,[dead],}"

# Keep a pane open when its program exits: "off", "on" or "failed" (only on
# a non-zero exit status).
remain-on-exit = "off"

# The clock of clock-mode (prefix t): its color, and "24" or "12" hours.
clock-mode-colour = "blue"
clock-mode-style = "24"

# Type into every pane of a window at once (tmux's synchronize-panes; most
# people turn it on for one window: "set -w synchronize-panes on").
synchronize-panes = false

# Bells and activity: which windows' bells reach you ("none", "any",
# "current", "other"), whether a bell is also shown as a message ("off",
# "on", "both"), and which windows are watched for bells and output.
bell-action = "any"
visual-bell = "off"
monitor-bell = true
monitor-activity = false
# The same for output in a watched window, and for a window that has been
# quiet for monitor-silence seconds (0: not watched).
activity-action = "other"
visual-activity = "off"
monitor-silence = 0
silence-action = "other"
visual-silence = "off"

# Size of sessions created without a client, and how a window shared by
# clients of different sizes is sized: "largest", "smallest", "manual" or
# "latest" (the client that was active last).
default-size = "80x24"
window-size = "latest"
# Size a window only for the clients that are showing it: a window that is
# not the current one keeps its size until it is selected.
aggressive-resize = false

# Layout sizes for main-horizontal / main-vertical, in cells or "50%".
main-pane-width = 80
main-pane-height = 24
other-pane-width = 0
other-pane-height = 0

# Most columns the tiled layout uses (0: no limit).
tiled-layout-max-columns = 0

# A line on each pane's border with its pane-border-format: "off", "top" or
# "bottom". The window gives up one row for it.
pane-border-status = "off"
pane-border-format = '#{?pane_active,#[reverse],}#{pane_index}#[default] "#{pane_title}"'

# The lines popups and menus are drawn with: "single", "rounded", "double",
# "heavy", "simple", "padded" or "none".
popup-border-lines = "single"
menu-border-lines = "single"

# Set the outer terminal's title (to set-titles-string, a format).
set-titles = false
set-titles-string = '#S:#I:#W - "#T"'

# ------------------------------------------------- programs that know tmux ---

# Unwrap tmux's passthrough escape (ESC P tmux; ... ESC \) for programs in
# panes: "off", "on" or "all" (same as on).
allow-passthrough = "off"

# Give new panes TMUX and TMUX_PANE (pointing at lif) for programs that only
# know tmux, such as Claude Code's agent teams; implies allow-passthrough.
# See docs/claude-code.md.
tmux-compat = false

# ---------------------------------------------------------- status line -----

[status]
# Show the status line. (status = false at the top of the file also works.)
enabled = true
# "top" or "bottom".
position = "bottom"
# Where the window list goes: "left", "centre", "right", "absolute-centre".
justify = "left"
# Seconds between status line refreshes (for clocks); 0 for never.
interval = 15
# Left and right parts: tmux formats, at most this many columns each.
left = "[#{session_name}] "
left-length = 10
right = '#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}"#{=21:pane_title}" %H:%M %d-%b-%y'
right-length = 40
# How each window is shown in the list, and what goes between them.
window-format = "#I:#W#{?window_flags,#{window_flags}, }"
current-window-format = "#I:#W#{?window_flags,#{window_flags}, }"
separator = " "

# ---------------------------------------------------------------- theme -----

# Styles, as a table or as a tmux style string ("fg=black,bg=green,bold").
# Table keys:
#   fg, bg, underline-color   "black" "red" "green" "yellow" "blue" "magenta"
#                             "cyan" "white", "bright" + any of those,
#                             "colour0".."colour255", "#rrggbb", "default"
#   bold, dim, italic, blink, reverse, hidden, strikethrough, overline
#                             true or false
#   underline                 true, false, "single", "double", "curly",
#                             "dotted" or "dashed"
# "default" (or {}) means the surrounding style: the status line's for its
# parts, the terminal's for the status line itself.
[theme]
status = { bg = "green", fg = "black" }
status-left = "default"
status-right = "default"
# Window list entries: every window, the current one, the last one, and
# windows with activity or a bell.
window = "default"
current-window = { underline = true }
last-window = "default"
activity = { reverse = true }
bell = { reverse = true }
# Pane borders (and the border next to the active pane), the copy-mode
# selection and position indicator, messages and prompts, and copy-mode
# search matches (every match, and the one the cursor is on).
border = "default"
active-border = "fg=green"
selection = "bg=yellow,fg=black"
message = "bg=yellow,fg=black"
match = "bg=cyan,fg=black"
current-match = "bg=magenta,fg=black"
# Default colors of pane contents, and of the active pane's (tmux's
# window-style and window-active-style).
pane = "default"
active-pane = "default"
# Popups and menus (display-popup, display-menu), their borders, and a
# menu's selected line.
popup = "default"
popup-border = "default"
menu = "default"
menu-selected = "bg=yellow,fg=black"
menu-border = "default"

# ---------------------------------------------------------- key bindings ----

# [keys] binds keys pressed after the prefix. Keys are tmux key names:
# "a", "A", "|", "C-a" (Ctrl), "M-Left" (Alt/Meta), "S-F5" (Shift),
# "Enter", "Space", "Tab", "BSpace", "Escape", "Up", "PPage", "F1".. "F12".
# A value is:
#   "split-window -h"                       a tmux command string
#   ["split-window -h", "select-layout tiled"]   several commands in turn
#   { command = "resize-pane -L 5", repeat = true }
#                                           repeatable: press it again within
#                                           repeat-time without the prefix
#                                           (note = "..." adds a description)
#   false  (or "none")                      remove a default binding
# Bindings not mentioned keep lif's defaults (tmux's).
[keys]
'"' = "split-window"
"%" = "split-window -h"
Up = { command = "select-pane -U", repeat = true }
# Examples:
# "|" = "split-window -h -c '#{pane_current_path}'"
# "-" = "split-window -v -c '#{pane_current_path}'"
# h = { command = "select-pane -L", repeat = true }
# x = "kill-pane"            # no confirmation
# "C-o" = false              # unbind rotate-window

# [keys.root] binds keys without the prefix: they no longer reach programs.
# tmux's mouse keys are bound here too (MouseDown3Pane, WheelUpStatus,
# C-MouseDown1Status, ...): in their commands the target "=" is what is
# under the mouse, and false removes what the mouse does there.
[keys.root]
# "M-Left" = "select-pane -L"
# "M-Right" = "select-pane -R"
# MouseDown3Pane = false
# "C-MouseDown1Status" = "kill-window -t ="

# [keys.copy-mode] and [keys.copy-mode-vi] bind keys in copy mode (emacs and
# vi mode-keys) the same way.

# ------------------------------------------------- hooks and environment ----

# [hooks] runs commands when something happens (tmux's set-hook -g). A value
# is a command string, a list of them (each runs), or false for none. The
# names are tmux's: after-new-window, after-split-window, session-created,
# client-attached, pane-exited and so on ("lif show-hooks -g" and
# "lif show-hooks -gw" list them all).
[hooks]
# after-split-window = "select-layout tiled"
# session-created = "run-shell 'date >> ~/.lif-sessions'"

# [env] sets environment variables for new panes and for the commands of
# run-shell, if-shell and #() (tmux's set-environment -g); false removes a
# variable from their environment.
[env]
# EDITOR = "nvim"
# SSH_ASKPASS = false

# [startup] has one key, run: a command or a list of commands the server
# runs once when it starts, after the settings above (not again when the
# file is reloaded). A .tmux.conf's commands that are not settings go here.
[startup]
# run = ["new-session -d -s main", "run-shell '~/bin/lif-start'"]
