[package]
name = "lif-vt"
description = "Terminal emulation engine abstraction for lif, backed by libghostty-vt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
lif-types.workspace = true
libghostty-vt = { workspace = true, optional = true }

[features]
default = ["ghostty"]
ghostty = ["dep:libghostty-vt"]

[dev-dependencies]
# Key round-trip tests start from the bytes an outer terminal sends.
lif-input.workspace = true
# The memory measurement reads the process footprint.
libc.workspace = true

[[test]]
name = "ghostty"
required-features = ["ghostty"]

[[test]]
name = "bench"
required-features = ["ghostty"]

[[test]]
name = "memory"
required-features = ["ghostty"]
