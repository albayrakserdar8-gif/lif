<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="lif">
  <title>lif</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232b3a"/>
      <stop offset="1" stop-color="#0e1219"/>
    </linearGradient>
    <linearGradient id="active" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#84cc16"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#364154"/>
      <stop offset="1" stop-color="#293243"/>
    </linearGradient>
  </defs>
  <!-- the terminal -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#bg)"/>
  <rect x="16.5" y="16.5" width="223" height="223" rx="51.5" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
  <!-- three panes: the active one on the left, two stacked on the right -->
  <rect x="46" y="46" width="94" height="164" rx="18" fill="url(#active)"/>
  <rect x="152" y="46" width="58" height="76" rx="16" fill="url(#pane)"/>
  <rect x="152" y="134" width="58" height="76" rx="16" fill="url(#pane)"/>
  <!-- a prompt and its cursor in the active pane -->
  <path d="M66 82 L88 100 L66 118" fill="none" stroke="#0e1219" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="96" y="108" width="26" height="12" rx="6" fill="#0e1219"/>
  <!-- output in the others -->
  <g stroke="#7b8799" stroke-width="7" stroke-linecap="round">
    <path d="M166 70 H196"/>
    <path d="M166 88 H184"/>
    <path d="M166 158 H190"/>
    <path d="M166 176 H196"/>
  </g>
</svg>
